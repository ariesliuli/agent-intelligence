name: Framework simulation CI
on:
  push:
    paths:
      - 'framework/**'
      - '.github/workflows/framework-ci.yml'
  pull_request:
    paths:
      - 'framework/**'
      - '.github/workflows/framework-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned test runner
        run: python -m pip install 'pytest==8.3.5'
      - name: Compile Python sources
        run: python -m compileall -q framework/agent_core framework/tests
      - name: Run isolated SQLite simulation suite
        working-directory: framework
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q tests/
