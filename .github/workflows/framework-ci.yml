name: Framework simulation CI
on:
  push:
    paths:
      - 'framework/**'
      - '.github/workflows/framework-ci.yml'
  pull_request:
    paths:
      - 'framework/**'
      - '.github/workflows/framework-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned test runner
        run: python -m pip install 'pytest==8.3.5'
      - name: Compile Python sources
        run: python -m compileall -q framework/agent_core framework/tests
      - name: Run isolated SQLite simulation suite
        working-directory: framework
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q tests/ --junitxml=verification-results.xml
      - name: Record verification environment
        if: always()
        working-directory: framework
        run: |
          python -c 'import json, os, platform, sqlite3, sys, subprocess; print(json.dumps(dict(commit=subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(), python=sys.version, sqlite=sqlite3.sqlite_version, platform=platform.platform(), run_id=os.environ["GITHUB_RUN_ID"], run_attempt=os.environ["GITHUB_RUN_ATTEMPT"]), indent=2))' > verification-environment.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: |
            framework/verification-results.xml
            framework/verification-environment.json
          if-no-files-found: error
          retention-days: 30
